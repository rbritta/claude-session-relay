name: release

# Tag a commit `vX.Y.Z` to build the VSIX and publish it as a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Build VSIX
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/claude-session-relay.vsix
          generate_release_notes: true
          body: |
            Download `claude-session-relay.vsix` below and install it with
            `code --install-extension claude-session-relay.vsix`, or get it from the
            VS Code Marketplace.
