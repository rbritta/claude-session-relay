name: release

# Tag a commit `vX.Y.Z` (the version in package.json) to test it, build the VSIX and publish a GitHub Release whose
# notes are the CHANGELOG section of that version. The Marketplace publish stays a manual step (CONTRIBUTING.md).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Release notes (the tag must name the version)
        run: |
          node tools/release-notes.js "$GITHUB_REF_NAME" > release-notes.md
          printf '\n---\n\nDownload `claude-session-relay.vsix` below and install it with\n`code --install-extension claude-session-relay.vsix`, or get it from the VS Code Marketplace.\n' >> release-notes.md

      - name: Test
        run: npm test

      - name: Build VSIX
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/claude-session-relay.vsix
          body_path: release-notes.md
