name: release

# Tag a commit `vX.Y.Z` to build the VSIX and publish it as a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        run: npm test

      - name: Build VSIX
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/claude-session-relay.vsix
          generate_release_notes: true
          body: |
            Download `claude-session-relay.vsix` below and install it with
            `code --install-extension claude-session-relay.vsix`, or get it from the
            VS Code Marketplace.
