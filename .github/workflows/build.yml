name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        run: npm test

      - name: Build VSIX
        run: npm run build

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-relay-vsix
          path: dist/claude-session-relay.vsix
          if-no-files-found: error
